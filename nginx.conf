events {

}
http {
    server {
    listen 80;
    server_name hornywhale.ru www.hornywhale.ru;

    # Перенаправляем с HTTP на HTTPS
    return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name hornywhale.ru www.hornywhale.ru;
        include mime.types; 
        # Указываем пути к сертификатам SSL
        ssl_certificate /home/fullchain.pem;
        ssl_certificate_key /home/privkey.pem;

        # Указываем базовые параметры безопасности SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:!aNULL:!eNULL:!EXPORT:!DES:!3DES:!RC4:!MD5:!PSK:!SHA1';
        ssl_prefer_server_ciphers on;

        # Это важный параметр, который гарантирует, что старые уязвимые клиенты не смогут подключиться
        ssl_dhparam /home/ssl-dhparams.pem;

        # Для сайта
        root /usr/share/nginx/html/browser;
        index index.html;

        # Улучшение безопасности HTTP-заголовков
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";

        # Обработка основных запросов
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Обработка Let's Encrypt (для автоматического получения сертификатов)
        # location /.well-known/acme-challenge/ {
        #     root /var/www/certbot;
        # }
    }
}