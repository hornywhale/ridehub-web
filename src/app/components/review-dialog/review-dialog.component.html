<div class="dialog-container">
    <mat-icon color="accent" class="dialog-icon">rate_review</mat-icon>
    <h2>Leave a Review</h2>
    <p>Tell us what you think about this bike!</p>
  
    <mat-form-field appearance="fill" class="w-full">
      <mat-label>Your Review</mat-label>
      <textarea matInput [formControl]="text" rows="4" placeholder="Write your review here..."></textarea>
    </mat-form-field>
  
    <mat-form-field appearance="fill" class="w-full">
      <mat-label>Rating</mat-label>
      <mat-select [formControl]="rating">
        <mat-option *ngFor="let r of [1,2,3,4,5]" [value]="r">{{ r }} ★</mat-option>
      </mat-select>
    </mat-form-field>
  
    <div class="buttons">
      <button mat-button (click)="dialogRef.close()">Cancel</button>
      <button mat-raised-button color="primary" (click)="submit()" [disabled]="!text.value || !rating.value">
        Submit
      </button>
    </div>
  </div>
