<div class="cart-container">
<h2 class="mb-4">🛒 Your Cart</h2>

<mat-card *ngFor="let item of cartItems" class="mb-3">
  <div class="flex-container">
    <img mat-card-image [src]="item.moto.imageUrl" alt="{{ item.moto.model }}" class="thumb" />
    <div class="info">
      <mat-card-title>{{ item.moto.brand }} {{ item.moto.model }}</mat-card-title>
      <mat-card-subtitle>{{ item.moto.location }}</mat-card-subtitle>
      <p>Rate: {{ item.moto.hourlyRate | currency:'EUR' }}/hour</p>

      <div class="quantity-controls">
        <button mat-icon-button (click)="decrement(item.moto.id)">
          <mat-icon>remove</mat-icon>
        </button>
        <span class="quantity">{{ item.quantity }}</span>
        <button mat-icon-button (click)="increment(item.moto.id)">
          <mat-icon>add</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="removeItem(item.moto.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>
  </div>
</mat-card>

<mat-divider *ngIf="cartItems.length > 0" class="my-3"></mat-divider>

<div *ngIf="cartItems.length > 0" class="total-section">
  <p><strong>Total:</strong> {{ getTotal() | currency:'EUR' }}</p>
  <button mat-raised-button color="primary" (click)="placeOrder()">Place Order</button>
</div>

<div *ngIf="cartItems.length === 0">
  <p>Your cart is empty.</p>
</div>
</div>
