<h2>Регистрация</h2>
<form (ngSubmit)="register()">
  <input [(ngModel)]="fullName" name="fullName" placeholder="ФИО" required><br>
  <input [(ngModel)]="email" name="email" placeholder="Email" required><br>
  <input [(ngModel)]="password" name="password" type="password" placeholder="Пароль" required><br>
  <input [(ngModel)]="phone" name="phone" placeholder="Телефон"><br>
  <input [(ngModel)]="address" name="address" placeholder="Адрес"><br>
  <input [(ngModel)]="favoriteType" name="favoriteType" placeholder="Любимый тип мотоциклов"><br>
  <button type="submit">Зарегистрироваться</button>
</form>
